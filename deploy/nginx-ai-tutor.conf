# Nginx site config for BMU AI Tutor (App Router).
# Save to /etc/nginx/sites-available/ai-tutor and symlink to sites-enabled.
# Replace your-domain.com with your real domain (DNS A record -> this VPS IP).
# After enabling:  sudo nginx -t && sudo systemctl reload nginx
# Then issue cert: sudo certbot --nginx -d your-domain.com -d www.your-domain.com

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Redirect all HTTP -> HTTPS
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Long-cache Next.js static assets (IMPORTANT: must be proxied, not 404)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # App
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # AI generation can take well over 60s on CPU; don't let nginx cut it off.
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
